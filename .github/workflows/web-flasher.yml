name: Build firmware and publish web flasher

on:
  push:
    branches: [main]
    paths: ['src/**', 'platformio.ini', 'web/**', 'tools/prepare_web_flasher.py', '.github/workflows/web-flasher.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install platformio==6.2.0 esptool==5.4.0
      - name: Build E32R35T firmware
        run: pio run -e cyd35
      - name: Package and verify web firmware
        run: python tools/prepare_web_flasher.py --version "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-artifact@v4
        with:
          name: hamdesk-e32r35t-firmware
          path: web/firmware/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web flasher
        id: deployment
        uses: actions/deploy-pages@v4
